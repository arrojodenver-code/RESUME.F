<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>John Denver Arrojo • Portfolio Resume</title> 
<!-- INSTANT THEME CHECK (Prevents screen flashing light/dark on load) -->
<script>
    if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.add('light-mode-init');
    }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
    --bg-dark:#07070c;
    --panel-glass:rgba(13,13,25,0.45);
    --border-glass:rgba(255,255,255,0.07);
    --accent-1:#d444f1;
    --accent-2:#00f5d4;
    --text-main:#f8fafc;
    --text-muted:#94a3b8;
}
body.light-mode{
    --bg-dark:#f1f5f9;
    --panel-glass:rgba(255,255,255,0.75);
    --border-glass:rgba(0,0,0,0.08);
    --text-main:#0f172a;
    --text-muted:#64748b;
    --accent-2:#008b7d;
}
body.light-mode .art-blob{
    opacity:0.15;
}
body.light-mode .hero-badge{
    background:rgba(212,68,241,0.1);
    border:1px solid rgba(212,68,241,0.2);
    color:#9333ea;
}
body.light-mode .card-title{
    background:linear-gradient(90deg,#0f172a,var(--text-muted));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

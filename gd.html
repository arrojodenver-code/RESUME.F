<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Navbar</title>
    <style>
        /* Base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Navbar Layout */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 8%;
            background-color: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Logo */
        .logo {
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #00f2fe;
        }

        /* Navigation Links */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 32px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        /* Gradient CTA Button (Download CV) */
        .btn-nav-cta {
            background: linear-gradient(90deg, #c084fc 0%, #38bdf8 50%, #00f2fe 100%);
            color: #0b0f19; /* Dark text as shown in the design */
            padding: 10px 24px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.6), 0 0 10px rgba(192, 132, 252, 0.4);
            filter: brightness(1.05);
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="#" class="logo">PORTFOLIO<span>.</span></a>
            
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><a href="#" class="btn-nav-cta">Download CV</a></li>
            </ul>
        </nav>
    </header>

</body>
</html>

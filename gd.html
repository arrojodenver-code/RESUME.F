<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass Navigation</title>
    <style>
        /* -------------------------------------------------------------
           CSS VARIABLES & THEMING
        ------------------------------------------------------------- */
        :root {
            --bg-dark: #07070c;
            --panel-glass: rgba(18, 18, 32, 0.75); 
            --border-glass: rgba(255, 255, 255, 0.12);
            --accent-1: #d444f1;
            --accent-2: #00f5d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --badge-bg: rgba(212, 68, 241, 0.1);
            --badge-border: rgba(212, 68, 241, 0.25);
            --badge-text: #fbcfff;
            --modal-bg: rgba(4, 4, 8, 0.98);
            --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            --glass-highlight: inset 0 1px 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* LIGHT MODE - Solid Milky Liquid Glass */
        html.light-mode,
        body.light-mode {
            --bg-dark: #f0f4f8;
            --panel-glass: rgba(248, 250, 252, 0.88); 
            --border-glass: rgba(255, 255, 255, 0.8);
            --accent-1: #b81bd6;
            --accent-2: #00b39b;
            --text-main: #0f172a;
            --text-muted: #475569;
            --badge-bg: rgba(184, 27, 214, 0.08);
            --badge-border: rgba(184, 27, 214, 0.2);
            --badge-text: #86109c;
            --modal-bg: rgba(240, 244, 248, 0.98);
            --glass-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
            --glass-highlight: inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.9);
        }

        /* -------------------------------------------------------------
           BASE & LAYOUT STYLES
        ------------------------------------------------------------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient glowing background Orbs to demonstrate glass refraction */
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            z-index: 0;
            pointer-events: none;
        }

        .orb-1 {
            width: 320px;
            height: 320px;
            background: var(--accent-1);
            top: -50px;
            left: 15%;
        }

        .orb-2 {
            width: 280px;
            height: 280px;
            background: var(--accent-2);
            top: 20px;
            right: 15%;
        }

        /* -------------------------------------------------------------
           LIQUID GLASS NAVBAR
        ------------------------------------------------------------- */
        .navbar-container {
            width: 100%;
            max-width: 900px;
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            border-radius: 100px; /* Fully capsule / pill shaped */
            
            background: var(--panel-glass);
            border: 1px solid var(--border-glass);
            
            /* Glass visual effects */
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            box-shadow: var(--glass-shadow), var(--glass-highlight);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
            text-decoration: none;
        }

        .brand-logo {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 24px;
            list-style: none;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-main);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Theme Toggle Button */
        .theme-toggle-btn {
            background: transparent;
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Badge Style */
        .badge {
            background-color: var(--badge-bg);
            border: 1px solid var(--badge-border);
            color: var(--badge-text);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Demo Content Section */
        .content {
            max-width: 800px;
            margin-top: 100px;
            text-align: center;
            z-index: 1;
        }

        .content h1 {
            font-size: 2.8rem;
            margin-bottom: 16px;
        }

        .content p {
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- Glowing backdrop Orbs -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <!-- Glass Navbar Container -->
    <div class="navbar-container">
        <nav class="navbar">
            <a href="#" class="brand">
                <div class="brand-logo"></div>
                <span>Glass UI</span>
            </a>

            <ul class="nav-links">
                <li><a href="#" class="nav-link active">Home</a></li>
                <li><a href="#" class="nav-link">Features</a></li>
                <li><a href="#" class="nav-link">Pricing</a></li>
            </ul>

            <div class="nav-actions">
                <span class="badge">Pro</span>
                <button class="theme-toggle-btn" id="themeToggle">
                    <span id="themeIcon">☀️</span>
                    <span id="themeText">Light</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Demo Content -->
    <main class="content">
        <h1>Milky Liquid Glass</h1>
        <p>This design creates a solid translucent glass appearance with high opacity, high saturation, and clean edge highlights—ensuring vivid ambient lights shine through smoothly in both light and dark themes.</p>
    </main>

    <script>
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        const htmlElement = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('light-mode');
            const isLight = htmlElement.classList.contains('light-mode');
            
            themeIcon.textContent = isLight ? '🌙' : '☀️';
            themeText.textContent = isLight ? 'Dark' : 'Light';
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Navbar</title>
    <style>
        :root {
            --bg-dark: #07070c;
            --panel-glass: rgba(13, 13, 25, 0.45);
            --border-glass: rgba(255, 255, 255, 0.07);
            --accent-1: #d444f1;
            --accent-2: #00f5d4;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        /* Base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Navbar Layout */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 8%;
            background-color: var(--panel-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Logo */
        .logo {
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent-2);
        }

        /* Navigation Links */
        .nav-links {
            display: flex;
            list-style: none;
            gap: 32px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-main);
        }

        /* Gradient CTA Button (Download CV) */
        .btn-nav-cta {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: var(--bg-dark);
            padding: 10px 24px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 245, 212, 0.25);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 245, 212, 0.45);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="#" class="logo">PORTFOLIO<span>.</span></a>
            
            <ul class="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><a href="#" class="btn-nav-cta">Download CV</a></li>
            </ul>
        </nav>
    </header>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphic Design | Portfolio</title>
  
  <!-- Anti-Flicker Theme Script -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.add('light-mode-init');
      }
    })();
  </script>

  <style>
    /* Global Styles & Variables */
    :root {
      --bg-dark: #0f1117;
      --bg-card: #181b24;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-1: #ff007a; /* Vibrant accent tuned for Graphic Design */
      --accent-2: #7928ca;
      --nav-bg: rgba(15, 17, 23, 0.8);
      --border-color: rgba(255, 255, 255, 0.1);
    }

    html.light-mode-init,
    body.light-mode {
      --bg-dark: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --nav-bg: rgba(248, 250, 252, 0.8);
      --border-color: rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      transition: background-color 0.3s ease, color 0.3s ease;
      line-height: 1.6;
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }

    .brand {
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1px;
      text-decoration: none;
      color: var(--text-main);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav a:hover, nav a.active {
      color: var(--text-main);
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .btn-cta {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #fff;
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* Hero Section */
    .hero {
      max-width: 1100px;
      margin: 4rem auto 2rem;
      padding: 0 1.5rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .hero-gradient {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.15rem;
      max-width: 650px;
      margin: 0 auto 2rem;
    }

    /* Gallery & Slider */
    .slider-container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      position: relative;
    }

    .slider-viewport {
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .slider-track {
      display: flex;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .slide {
      min-width: 100%;
      cursor: pointer;
    }

    .slide img {
      width: 100%;
      height: 500px;
      object-fit: cover;
      display: block;
    }

    /* Slider Thumbnails */
    .thumbnails {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    .thumb {
      width: 60px;
      height: 40px;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      opacity: 0.5;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .thumb.active {
      opacity: 1;
      border-color: var(--accent-1);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .modal.open {
      display: flex;
    }

    .modal-img {
      max-width: 90%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <a href="#" class="brand">ARROJO PORTFOLIO</a>
    <nav>
      <a href="ux.html">UX Design</a>
      <a href="gd.html" class="active">Graphic Design</a>
      <button class="theme-toggle-btn" id="themeToggleBtn">Toggle Theme</button>
      <a href="#" class="btn-cta">Download CV</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Visuals & <span class="hero-gradient">Graphic Design</span></h1>
    <p>A showcase of brand identity, digital illustrations, poster concepts, and promotional artwork built with precise composition and typography.</p>
    <a href="https://figma.com" target="_blank" class="btn-cta">Open Figma Workspace</a>
  </section>

  <!-- Gallery Showcase Slider -->
  <section class="slider-container">
    <div class="slider-viewport">
      <div class="slider-track" id="sliderTrack">
        <div class="slide"><img src="https://picsum.photos/1000/500?random=1" alt="Graphic Design 1"></div>
        <div class="slide"><img src="https://picsum.photos/1000/500?random=2" alt="Graphic Design 2"></div>
        <div class="slide"><img src="https://picsum.photos/1000/500?random=3" alt="Graphic Design 3"></div>
      </div>
    </div>

    <!-- Pagination Thumbnails -->
    <div class="thumbnails" id="thumbContainer">
      <div class="thumb active" data-index="0"><img src="https://picsum.photos/1000/500?random=1" alt="Thumb 1"></div>
      <div class="thumb" data-index="1"><img src="https://picsum.photos/1000/500?random=2" alt="Thumb 2"></div>
      <div class="thumb" data-index="2"><img src="https://picsum.photos/1000/500?random=3" alt="Thumb 3"></div>
    </div>
  </section>

  <!-- Lightbox Modal -->
  <div class="modal" id="lightboxModal">
    <img src="" alt="Enlarged View" class="modal-img" id="modalImage">
  </div>

  <script>
    // --- Theme Switcher with View Transitions ---
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    
    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      document.documentElement.classList.remove('light-mode-init');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }

    themeToggleBtn.addEventListener('click', (e) => {
      if (!document.startViewTransition) {
        toggleTheme();
        return;
      }
      document.startViewTransition(() => toggleTheme());
    });

    // Ensure state matches on load
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-mode');
    }

    // --- Slider & Gallery logic ---
    const track = document.getElementById('sliderTrack');
    const slides = document.querySelectorAll('.slide');
    const thumbs = document.querySelectorAll('.thumb');
    let currentIndex = 0;
    let autoSlideInterval;

    function goToSlide(index) {
      currentIndex = index;
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
      thumbs.forEach((t, i) => t.classList.toggle('active', i === currentIndex));
    }

    function startAutoSlide() {
      autoSlideInterval = setInterval(() => {
        const nextIndex = (currentIndex + 1) % slides.length;
        goToSlide(nextIndex);
      }, 5000);
    }

    function stopAutoSlide() {
      clearInterval(autoSlideInterval);
    }

    thumbs.forEach(thumb => {
      thumb.addEventListener('click', (e) => {
        stopAutoSlide();
        const index = parseInt(e.currentTarget.getAttribute('data-index'));
        goToSlide(index);
        startAutoSlide();
      });
    });

    startAutoSlide();

    // --- Lightbox Modal ---
    const modal = document.getElementById('lightboxModal');
    const modalImg = document.getElementById('modalImage');

    slides.forEach(slide => {
      slide.addEventListener('click', () => {
        const imgSource = slide.querySelector('img').src;
        modalImg.src = imgSource;
        modal.classList.add('open');
      });
    });

    modal.addEventListener('click', () => modal.classList.remove('open'));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') modal.classList.remove('open');
    });
  </script>
</body>
</html>
